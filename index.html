function node(n){return `<button class="arch-node ${n[0]==='certified'||n[0]==='registry'?'accent':''}" onclick="showArch('${n[0]}')">${icon(n[1])}<strong>${n[2]}</strong><small>${n[3]}</small></button>`}
function architecture(){return header('Arquitetura','As peças do processo, suas conexões e como o Hub recebe informação.')+`<div class="page-note"><b>Visão conceitual para validação.</b> Baseada nas telas e conversas disponíveis. Conexões e responsabilidades devem ser conferidas com o fluxo real. Clique nas peças para explorar.</div><section class="panel">${panelhead('Cadeia de imagens base','Da origem do artefato à evidência de consumo',link('Ver estado das imagens','journey'))}<div class="arch-group"><div class="arch-label">01 · Produção e distribuição de imagens</div><div class="arch-flow">${archNodes.slice(0,4).map(node).join('')}</div></div><div class="arch-divider">Imagens derivadas seguem para o consumo das aplicações ↓</div><div class="arch-group"><div class="arch-label">02 · Consumo, ambientes e rastreabilidade</div><div class="arch-flow">${archNodes.slice(4).map(node).join('')}</div></div><div class="arch-observe"><div class="observe-box"><strong>Automações e coletores</strong><p>Eventos e resultados de toda a cadeia</p><div class="chip-row">${['certified','arch','catalog','ecr-inventory','consumption'].map(s=>`<span class="chip">${s}</span>`).join('')}</div></div><span>→</span><div class="observe-box"><strong>S3 · dados e evidências</strong><p>Datasets versionados · última coleta<br>Estado da fonte · histórico de execução</p></div><span>→</span><div class="observe-box" style="border-color:#edc9c6;background:#fff7f6"><strong style="color:var(--red)">Base Image Hub</strong><p>Operação · jornada · catálogo<br>Cobertura · arquitetura · roadmap</p></div></div></section><div class="bottomrow"><section class="panel">${panelhead('Controles ao longo da cadeia','Informações que a interface deve conectar')}<div style="padding:0 21px 20px"><div class="chip-row">${['Origem e digest','Hardening','Vulnerabilidades','SBOM','Assinatura','Certified Gate','Lineage','Adoção por ambiente'].map(x=>`<span class="chip">${x}</span>`).join('')}</div></div></section><section class="panel">${panelhead('Integrações em evolução','Evoluções previstas no cenário')}<div style="padding:0 21px 20px"><p class="sub">Coletor JFrog/Xray, visibilidade ampliada dos ambientes e ações operacionais pelo Hub.</p>${link('Consultar roadmap','roadmap')}</div></section></div>`+footer()}
const tasks=[{id:'catalog',state:0,tag:'CATÁLOGO',title:'Catálogo central de imagens',desc:'Consolidar versões, estados e evidências em uma única visão.',owner:'Segurança de aplicações',time:'Cenário · entregue'},{id:'daily',state:0,tag:'OPERAÇÃO',title:'Execuções e histórico diário',desc:'Acompanhar rotina, resultado e atualização das fontes.',owner:'Segurança de aplicações',time:'Cenário · entregue'},{id:'consumer',state:1,tag:'INTEGRAÇÃO',title:'Completar coleta de consumo',desc:'Resolver permissão de busca e reconciliar os consumidores.',owner:'Segurança + Plataforma',time:'Próxima entrega · a definir'},{id:'lineage',state:1,tag:'GOVERNANÇA',title:'Rastreabilidade das derivadas',desc:'Conectar digest de origem, imagem derivada e ambiente.',owner:'Arquitetura',time:'Prazo · a definir'},{id:'access',state:2,tag:'ACESSO',title:'Permissão para busca no GitHub',desc:'Dependência para cobertura completa dos repositórios.',owner:'Administração GitHub',time:'Bloqueio · acesso pendente'},{id:'jfrog',state:3,tag:'INTEGRAÇÃO',title:'Coletor JFrog / Xray',desc:'Trazer inventário, políticas e resultados para o Hub.',owner:'Plataforma',time:'Prazo · a definir'},{id:'env',state:3,tag:'COBERTURA',title:'Ampliar visão dos ambientes',desc:'Consolidar evidências de adoção por ambiente e país.',owner:'Plataforma',time:'Prazo · a definir'},{id:'actions',state:3,tag:'EVOLUÇÃO',title:'Ações operacionais no Hub',desc:'Solicitar novas imagens e acionar automações com governança.',owner:'A definir',time:'Evolução futura'}];
function roadmap(){return header('Roadmap','Entregas e dependências que ampliam a capacidade do Base Image Hub.')+`<div class="page-note"><b>Planejamento demonstrativo.</b> Itens ilustram a organização proposta. Prazos, responsáveis e estados precisam ser confirmados pela equipe.</div><div class="kanban">${['Entregue','Em andamento','Bloqueado','Planejado'].map((name,n)=>`<section class="kanban-col"><div class="kanban-title">${name}<span>${tasks.filter(t=>t.state===n).length}</span></div>${tasks.filter(t=>t.state===n).map(t=>`<button class="task" onclick="showTask('${t.id}')">${badge(t.tag,['good','blue','warn','gray'][n])}<h3>${t.title}</h3><p>${t.desc}</p><footer>${t.owner}<br>${t.time}</footer></button>`).join('')}</section>`).join('')}</div>`+footer()}
function go(id){current=id;filterText='';filterStatus='all';const p=pages.find(p=>p[0]===id)||pages[0];document.title=`Base Image Hub · ${p[1]}`;document.getElementById('nav').innerHTML=pages.map((p,n)=>`${n===5?'<div class="navdivider"></div><div class="navlabel">CONTEXTO & EVOLUÇÃO</div>':''}<button class="navbtn ${p[0]===id?'active':''}" ${p[0]===id?'aria-current="page"':''} onclick="go('${p[0]}')" title="${p[1]}">${icon(p[2])}<span>${p[1]}</span>${p[0]==='automations'?'<span class="navcount">3</span>':''}</button>`).join('');document.getElementById('mobile-nav').value=id;document.getElementById('main').innerHTML=({overview,journey,automations:autoPage,catalog,coverage,architecture,roadmap}[id]||overview)();window.scrollTo(0,0)}
function updateResults(type){const text=filterText.toLocaleLowerCase('pt-BR').trim();const list=images.filter(i=>(filterStatus==='all'||i.status===filterStatus)&&(i.name+' '+i.version).toLocaleLowerCase('pt-BR').includes(text));document.getElementById('result-count').textContent=`${list.length} ${list.length===1?'imagem':'imagens'}`;document.getElementById('results').innerHTML=list.length?(type==='catalog'?catalogCards(list):journeyTable(list)):'<div class="empty">Nenhuma imagem corresponde aos filtros.<br><button class="textbtn" onclick="clearFilters(current)">Limpar filtros</button></div>'}
function clearFilters(type){filterText='';filterStatus='all';document.getElementById('search').value='';document.getElementById('status-filter').value='all';updateResults(type)}
function modal(label,title,body){document.getElementById('detail-label').textContent=label;document.getElementById('detail-title').textContent=title;document.getElementById('detail-body').innerHTML=body;document.getElementById('detail').showModal()}
function showImage(id){const i=images.find(x=>x.id===id);modal('DETALHE DA IMAGEM',i.name,`${badge(i.label,i.status)}<p style="margin-top:16px">${i.desc}</p><div class="detail-grid"><div><small>Versão demonstrativa</small><strong>${i.version}</strong></div><div><small>Última execução</small><strong>${i.time==='—'?'Ainda não executou':'Hoje, '+i.time}</strong></div><div><small>Vulnerabilidades conhecidas</small><strong>${i.cves===null?'Não avaliado':i.cves+' CVEs · '+i.fix+' com correção'}</strong></div><div><small>Consumo observado mais avançado</small><strong>${i.env==='—'?'Sem evidência':i.env}</strong></div></div><h3>Jornada desta imagem</h3><ul class="detail-list">${stages.map((s,n)=>`<li><span>${s}</span>${badge(stateText[i.stages[n]],i.stages[n])}</li>`).join('')}</ul><p style="font-size:11px;margin-top:15px">Evidências e logs reais serão vinculados quando as fontes estiverem integradas.</p>`)}
function showStage(n){modal('ETAPA DA JORNADA',stages[n],`<p>Estado das imagens nesta etapa do cenário. A etapa só é marcada como concluída quando há evidência correspondente.</p><ul class="detail-list">${images.map(i=>`<li><span>${i.name}</span>${badge(stateText[i.stages[n]],i.stages[n])}</li>`).join('')}</ul>`)}
function showAuto(id){const a=automations.find(a=>a.id===id);modal('AUTOMAÇÃO',a.name,`${badge(a.label,a.status)}<p style="margin-top:16px">${a.detail}</p><div class="detail-grid"><div><small>Última execução</small><strong>${a.time==='—'?'Ontem, 07:11':'Hoje, '+a.time}</strong></div><div><small>Próxima / prevista</small><strong>${a.next}</strong></div><div><small>Frequência</small><strong>Diária</strong></div><div><small>Fonte</small><strong>${a.id}</strong></div></div><p style="font-size:11px">Ações de reexecução e acesso aos logs entrarão na integração com o backend. Esta prévia permite explorar os estados e a organização das informações.</p>`)}
function showArch(id){const n=archNodes.find(x=>x[0]===id);modal('ARQUITETURA · VISÃO CONCEITUAL',n[2],`<p>${n[4]}</p><div class="page-note section-gap">${n[3]}</div><p style="font-size:11px">Componente apresentado para validação da arquitetura. Fluxos e responsabilidades exatos dependem da confirmação do processo real.</p>`)}
function showTask(id){const t=tasks.find(t=>t.id===id);modal('ROADMAP',t.title,`${badge(['Entregue','Em andamento','Bloqueado','Planejado'][t.state],['good','blue','warn','gray'][t.state])}<p style="margin-top:16px">${t.desc}</p><div class="detail-grid"><div><small>Equipe proposta</small><strong>${t.owner}</strong></div><div><small>Prazo</small><strong>${t.time}</strong></div></div>`)}
function downloadHTML(){const copy=document.documentElement.cloneNode(true);copy.querySelector('dialog').removeAttribute('open');copy.querySelectorAll('.toast').forEach(e=>e.remove());const blob=new Blob(['<!doctype html>\n'+copy.outerHTML],{type:'text/html;charset=utf-8'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='base-image-hub.html';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.getElementById('brand-icon').innerHTML=icon('box');document.getElementById('mobile-nav').innerHTML=pages.map(p=>`<option value="${p[0]}">${p[1]}</option>`).join('');document.getElementById('mobile-nav').onchange=e=>go(e.target.value);document.getElementById('detail').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close()}});go('overview');
</script>
</body>
</html>
