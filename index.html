function imagePhase(i){if(i.id==='pyspark')return 'Segunda camada · falha';if(i.id==='debezium-operator')return 'Observação · fonte indisponível';const states=i.stages.slice(0,4);const blocked=states.findIndex(s=>s==='danger'||s==='warn');if(blocked>=0)return baseStages[blocked]+' · '+(states[blocked]==='danger'?'falha':'atenção');const last=states.lastIndexOf('good');return last>=0?baseStages[last]+' · cenário':'Sem execução no cenário'}
function imageList(list){return `<div class="image-list"><div class="image-row image-row-head"><span>Imagem e versão</span><span>Estado no cenário</span><span>Etapa da base no cenário</span><span>Consumo ilustrativo</span></div>${list.map(i=>`<button class="image-row" onclick="showImage('${i.id}')" aria-label="Abrir ficha da imagem ${i.name}"><span class="image-name"><span class="image-symbol">${icon('box')}</span><span><strong>${i.name}</strong><small>${i.version}</small></span></span><span>${badge(i.label,i.status)}</span><span>${imagePhase(i)}</span><span>${i.env==='—'?'Sem ambiente informado':i.env+' · aplicação não informada'}</span></button>`).join('')}</div><div class="legend"><span>${badge('Cenário fictício','blue')}</span><span>Sem aplicação, release e digest implantado não há consumo comprovado.</span></div>`}
function toolbar(){return `<div class="toolbar"><label class="search">${icon('search')}<input id="search" placeholder="Buscar imagem ou tecnologia" aria-label="Buscar imagem ou tecnologia" oninput="filterText=this.value;updateResults()"></label><select id="status-filter" aria-label="Filtrar estado no cenário" onchange="filterStatus=this.value;updateResults()"><option value="all">Todos os estados</option><option value="good">Certificadas no cenário</option><option value="warn">Em validação no cenário</option><option value="danger">Bloqueadas no cenário</option><option value="gray">Sem evidência ou desconhecidas</option></select><button class="textbtn" onclick="clearFilters()">Limpar filtros</button><span class="count" id="result-count">8 imagens do cenário</span></div>`}
function node(n){const tone=n[9].includes('Lacuna')||n[9].includes('Proposto')?'warn':n[9].includes('Existente')?'good':'gray';return `<button class="arch-node ${n[0]==='gate1'?'accent':''}" onclick="showArch('${n[0]}')" aria-label="Abrir detalhes de ${n[2]}">${icon(n[1])}<strong>${n[2]}</strong><small>${n[3]}</small><span class="badge ${tone}" style="margin-top:10px">${n[9]}</span></button>`}
function go(id){if(document.getElementById('detail').open)document.getElementById('detail').close();current=id;filterText='';filterStatus='all';const navId=id;const p=pages.find(p=>p[0]===navId)||pages[0];document.title=`Base Image Hub · ${p[1]}`;document.getElementById('nav').innerHTML=pages.map((p,n)=>`${p[0]==='architecture'?'<div class="navdivider"></div><div class="navlabel">CONTEXTO & EVOLUÇÃO</div>':''}<button class="navbtn ${p[0]===navId?'active':''}" ${p[0]===navId?'aria-current="page"':''} onclick="go('${p[0]}')" title="${p[1]}">${icon(p[2])}<span>${p[1]}</span></button>`).join('');document.getElementById('mobile-nav').value=navId;document.getElementById('main').innerHTML=({overview,images:operationalImagesPage,automations:autoPage,coverage,architecture,roadmap}[id]||overview)();window.scrollTo(0,0)}
function updateResults(){const text=filterText.toLocaleLowerCase('pt-BR').trim();const list=images.filter(i=>(filterStatus==='all'||i.status===filterStatus)&&(i.name+' '+i.version).toLocaleLowerCase('pt-BR').includes(text));document.getElementById('result-count').textContent=`${list.length} ${list.length===1?'imagem do cenário':'imagens do cenário'}`;document.getElementById('results').innerHTML=list.length?imageList(list):'<div class="empty">Nenhuma imagem do cenário corresponde aos filtros. Isso não indica ausência de imagens reais.<br><button class="textbtn" onclick="clearFilters()">Limpar filtros</button></div>'}
function clearFilters(){filterText='';filterStatus='all';document.getElementById('search').value='';document.getElementById('status-filter').value='all';updateResults()}
let modalReturnFocus=null;
function modal(label,title,body){const dialog=document.getElementById('detail');if(!dialog.open&&document.activeElement instanceof HTMLElement&&document.activeElement!==document.body&&!dialog.contains(document.activeElement))modalReturnFocus=document.activeElement;dialog.classList.remove('image-dialog','run-dialog');if(dialog.open)dialog.close();document.getElementById('detail-label').textContent=label;document.getElementById('detail-title').textContent=title;document.getElementById('detail-body').innerHTML=body;document.getElementById('detail').showModal()}

<section class="panel">${panelhead('Execuções do cenário','Abra o run para ver motivo, digest, gate, artefatos, responsável e ação permitida.')}${demoFilters()}<div id="demo-run-results">${demoRunList(demoRunFilter())}</div></section>
<section class="panel section-gap">${panelhead('Pedidos e retomada','O registro demonstra a trilha desejada; resultado externo continua desconhecido.')}<div class="demo-log">${demoRequestLog()}</div></section>
<section class="panel section-gap">${panelhead('Rotinas do processo','Papel informado; nenhum job real desta lista está conectado ao Hub.')}<div class="demo-routines">${automations.map(a=>`<button class="auto-card" onclick="showAuto('${a.id}')"><strong>${a.name}</strong><small>${a.desc}</small>${badge(a.label,a.label==='Lacuna no gate'?'warn':'gray')}</button>`).join('')}</div></section>`+footer()}
const demoArtifacts={
 'DEMO-RUN-042':[
  ['DEMO-GATE-042','Recibo do gate existente','Resultado ilustrativo: aprovado','GitHub Actions / aprovador do processo'],
  ['DEMO-SBOM-042','SBOM CycloneDX','Estrutura de componentes ilustrada; arquivo não incluído','Job de SBOM informado'],
  ['DEMO-SCAN-042','Resultado de scan','Resultado ilustrativo; relatório não incluído','Scanner informado'],
  ['DEMO-SIGN-042','Assinatura','Vínculo ilustrado; assinatura não verificável aqui','Processo de assinatura informado'],
  ['DEMO-SLSA-042','Atestado SLSA','Metadados ilustrados; atestado não verificável aqui','Job de atestação informado']
 ],
 'DEMO-RUN-043':[['DEMO-LOG-043','Log do build','Falha ilustrativa; log bruto não incluído','GitHub Actions / build da segunda camada']],
 'DEMO-RUN-044':[]
};
function demoArtifactLinks(r){const list=demoArtifacts[r.id]||[];return list.length?`<div class="demo-artifacts">${list.map(a=>`<button class="textbtn" onclick="showDemoArtifact('${r.id}','${a[0]}')">${a[1]} · ${a[0]} →</button>`).join('')}</div>`:'<span class="sub">Sem artefato atual; fonte indisponível.</span>'}
function showDemoArtifact(runId,artifactId){const r=demoRun(runId),a=(demoArtifacts[runId]||[]).find(x=>x[0]===artifactId);if(!r||!a)return;modal('ARTEFATO · EXEMPLO ILUSTRATIVO',a[0],`<div class="page-note"><b>${a[1]}.</b> Esta ficha demonstra o metadado que o Hub deveria vincular; não há bytes, assinatura ou relatório real para abrir ou verificar.</div><div class="detail-grid"><div><small>Run e imagem</small><strong>${r.id} · ${r.title}</strong></div><div><small>Tipo de artefato</small><strong>${a[1]}</strong></div><div><small>Resultado/limite</small><strong>${a[2]}</strong></div><div><small>Fonte/autoridade informada</small><strong>${a[3]}</strong></div><div><small>Digest ao qual seria ligado</small><strong class="demo-digest">${r.certified}</strong></div><div><small>Verificação real</small><strong>Não realizada nesta prévia</strong></div></div><button class="btn" onclick="showRun('${runId}')">Voltar ao run</button>`)}
function runChain(r){return `<div class="demo-chain"><div><small>Imagem / run</small><strong>${r.title}</strong><span>${r.id}</span></div><div><small>Digest de origem</small><strong>${demoShort(r.index)}</strong><span>${r.child.startsWith('sha256:')?'Filho '+demoShort(r.child):r.child}</span></div><div><small>Gate e evidência</small><strong>${r.gateState}</strong><span>${r.gate}</span></div><div><small>Publicação</small><strong>${demoShort(r.published)}</strong><span>${r.published.startsWith('sha256:')?'Mesmo digest certificado no cenário':'Sem prova de publicação'}</span></div><div><small>Consumo</small><strong>${r.consumer}</strong><span>Aplicação, release e ambiente exigem prova própria</span></div></div>`}
function showRun(id){const r=demoRun(id);if(!r)return;modal('RUN · EXEMPLO ILUSTRATIVO',r.id,`<div class="page-note"><b>${demoState[r.state][0]}.</b> ${r.reason} O exemplo não representa uma execução ou autorização real.</div>${runChain(r)}${r.parentImage?`<div class="page-note"><b>Base de origem desta derivada · DEMO:</b> UBI 9 versão ${r.parentVersion}, digest certificado ${demoShort(r.parentCertified)}. <button class="textbtn" onclick="showImage('${r.parentImage}')">Abrir base →</button> A derivada não produziu digest.</div>`:''}<div class="detail-grid"><div><small>Origem e horário no cenário</small><strong>${r.source}<br>${r.time}</strong></div><div><small>Responsável pelo próximo tratamento</small><strong>${r.owner}</strong></div><div><small>Artefatos associados no cenário</small>${demoArtifactLinks(r)}</div><div><small>Digest certificado da base</small><strong class="demo-digest">${r.certified}</strong></div><div><small>Digest do índice OCI</small><strong class="demo-digest">${r.index}</strong></div><div><small>Digest filho e plataforma</small><strong class="demo-digest">${r.child}<br>${r.child.startsWith('sha256:')?'linux/amd64 · ilustrativo':'plataforma desconhecida'}</strong></div></div><div class="demo-actions"><button class="btn" onclick="document.getElementById('detail').close();showImage('${r.image}')">Abrir ficha da imagem</button>${r.state==='blocked'?`<button class="btn" onclick="prepareDemoRequest('${r.id}','Solicitar avaliação da falha',this)">Simular avaliação da falha</button><button class="btn" onclick="prepareDemoRequest('${r.id}','Solicitar reexecução no CI existente',this)">Simular pedido de reexecução</button>`:r.state==='unknown'?`<button class="btn" onclick="prepareDemoRequest('${r.id}','Solicitar atualização da fonte',this)">Simular atualização da fonte</button>`:'<span class="sub">Gate concluído no cenário: nenhuma ação de aprovação ou reexecução oferecida aqui.</span>'}</div><div id="demo-request-area"></div><div class="page-note"><b>Autoridade:</b> este Hub não chama GitHub Actions, JFrog, ECR ou EKS e não aprova a imagem. Assinatura, SBOM CycloneDX e atestado SLSA aparecem como artefatos de exemplo, não foram gerados ou validados por esta página.</div>`);document.getElementById('detail').classList.add('run-dialog')}
function prepareDemoRequest(id,type,trigger){
 demoRequest={run:id,type};demoRequestTrigger=trigger||document.activeElement;
 const target=document.getElementById('demo-request-area');if(!target)return;
 target.innerHTML=`<div class="demo-confirm"><strong>Registrar pedido DEMO?</strong><p>${type} para ${id}. Isso cria somente um registro neste navegador; nenhuma ferramenta externa será acionada e nenhuma imagem será aprovada.</p><button class="btn red" onclick="confirmDemoRequest()">Confirmar registro local</button> <button class="btn" onclick="cancelDemoRequest()">Cancelar</button></div>`;
 target.querySelector('.btn.red')?.focus();target.scrollIntoView({block:'nearest'});
}
function cancelDemoRequest(){const target=document.getElementById('demo-request-area');if(target)target.innerHTML='';demoRequest=null;if(demoRequestTrigger?.isConnected)demoRequestTrigger.focus();demoRequestTrigger=null}
function confirmDemoRequest(){
 if(!demoRequest)return;
 const next=demoRequests.length+1;
 const item={id:'DEMO-REQ-'+String(next).padStart(3,'0'),run:demoRequest.run,type:demoRequest.type,time:new Date().toLocaleString('pt-BR')};
 demoRequests.push(item);try{localStorage.setItem('baseimage-demo-requests',JSON.stringify(demoRequests))}catch(e){}
 document.querySelectorAll('.demo-log').forEach(node=>node.innerHTML=demoRequestLog());
 const target=document.getElementById('demo-request-area');
 if(target){target.innerHTML=`<div class="demo-confirm" role="status" tabindex="-1"><strong>${item.id} registrado somente nesta prévia.</strong><p>Pedido: ${item.type}; run: ${item.run}. Estado no CI real: desconhecido. Volte a Automações para ver o registro local.</p></div>`;target.firstElementChild.focus()}
 demoRequest=null;demoRequestTrigger=null;
}
function operationalImagesPage(){return originalHeader('Imagens','Uma lista de bases e derivadas; abra a ficha para ligar versão, digest, run, gate, publicação e consumo.')+`<div class="page-note"><b>Cenário fictício.</b> Oito imagens demonstram estados da interface; três possuem runs DEMO interligados. Digests sintéticos servem apenas para verificar o vínculo entre telas. Nenhum artefato real está conectado.</div><section class="panel">${panelhead('Imagens do cenário','Selecione uma imagem para ver identidade, execução, evidência e uso.')}${toolbar()}<div id="results">${imageList(images)}</div></section>`+footer()}
function operationalShowImage(id){const i=images.find(x=>x.id===id);if(!i)return;const r=demoRunForImage(id);const info=r?`<div class="demo-chain"><div><small>Run</small><strong>${r.id}</strong><span>${r.phase}</span></div><div><small>Gate</small><strong>${r.gateState}</strong><span>${r.gate}</span></div><div><small>Publicação ECR</small><strong>${demoShort(r.published)}</strong><span>${r.published.startsWith('sha256:')?'Mesmo digest certificado da base':'Sem confirmação'}</span></div><div><small>Consumo</small><strong>${r.consumer}</strong><span>Implantação depende de release e digest observado</span></div></div><button class="btn" onclick="document.getElementById('detail').close();showRun('${r.id}')">Abrir execução e evidências</button>`:'<div class="empty-consumption">Nenhuma execução está ligada a esta imagem nesta prévia. Estado operacional e digests: desconhecidos.</div>';const consumption=r&&r.published.startsWith('sha256:')?`<div class="image-facts"><div><small>Publicação ECR</small><strong>Indicada no cenário</strong></div><div><small>Digest publicado</small><strong class="demo-digest">${r.published}</strong></div><div><small>Aplicação / release / ambiente</small><strong>Não confirmados</strong></div></div>`:'<div class="empty-consumption">Sem publicação ou consumo confirmados nesta execução do cenário. Aplicação, release, digest implantado e ambiente exigem evidência distinta.</div>';const lineage=r?.parentImage?`<section class="image-detail-section"><h3>Base de origem desta derivada</h3><p>Vínculo exclusivamente sintético: a tentativa de derivar PySpark partiu da base UBI 9 versão ${r.parentVersion}, certificada no cenário sob o digest abaixo. O build da derivada falhou, sem novo digest ou publicação.</p><div class="image-facts"><div><small>Família da base</small><strong>UBI 9</strong></div><div><small>Versão da base</small><strong>${r.parentVersion}</strong></div><div><small>Digest certificado da base · DEMO</small><strong class="demo-digest">${r.parentCertified}</strong></div></div><button class="btn" onclick="showImage('${r.parentImage}')">Abrir ficha da base de origem</button></section>`:i.id==='ubi9'?`<section class="image-detail-section"><h3>Derivada relacionada no cenário</h3><p>PySpark 4.0 referencia este digest da base no exemplo. Seu build falhou antes de produzir digest da derivada ou chegar a um gate.</p><button class="btn" onclick="showImage('pyspark')">Abrir derivada PySpark e run</button></section>`:'';modal('IMAGEM · EXEMPLO ILUSTRATIVO',i.name,`<div class="image-detail-intro">${badge(i.label+' no cenário',i.status)}<p>${i.desc}</p></div><section class="image-detail-section"><h3>1 · Identidade da imagem</h3><p>Tag é uma referência mutável. Índice OCI, manifesto filho e digest certificado precisam permanecer distintos.</p><div class="image-facts"><div><small>Família / versão</small><strong>${i.name} · ${i.version}</strong></div><div><small>Alias ou tag no cenário</small><strong>${r&&r.state==='done'?'9.6 · exemplo':'Não informada'}</strong></div><div><small>${r&&r.index.startsWith('sha256:')?'Índice OCI · sintético':'Índice OCI · não confirmado'}</small><strong class="demo-digest">${r?r.index:'Sem evidência'}</strong></div><div><small>${r&&r.child.startsWith('sha256:')?'Filho linux/amd64 · sintético':'Filho e plataforma · não confirmados'}</small><strong class="demo-digest">${r?r.child:'Sem evidência'}</strong></div><div><small>${r&&r.certified.startsWith('sha256:')?'Digest certificado · sintético':'Digest certificado · não confirmado'}</small><strong class="demo-digest">${r?r.certified:'Sem evidência'}</strong></div><div><small>Tipo</small><strong>${r?r.kind:'Não definido'}</strong></div></div></section>${lineage}<section class="image-detail-section"><h3>2 · Jornada da imagem</h3><p>Marcas desta linha são ilustrativas; não substituem recibos do CI. No caso de uma derivada, a falha de construção pertence à segunda camada. Homologação e produção são estados de consumo de aplicação.</p><div class="image-journey">${baseStages.map((name,n)=>`<div><small>${n+1}. ${name}</small>${badge(stateText[i.stages[n]],i.stages[n])}</div>`).join('')}</div></section><section class="image-detail-section"><h3>3 · Execução, gate e artefatos</h3>${info}${r?`<div class="page-note"><b>Artefatos do cenário:</b> ${r.artifact}. Para evidência operacional seriam necessários links, origem, digest, data, resultado e autoridade; nenhum arquivo foi conectado aqui.</div>`:''}<p>O gate da primeira camada é informado como existente. Aprovação equivalente da segunda camada permanece lacuna, mesmo quando scans aparecem no cenário.</p></section><section class="image-detail-section"><h3>4 · Publicação e consumo</h3><p>Publicar em ECR não comprova que uma aplicação foi reconstruída e implantada. O consumo exige aplicação, release, FROM, digest e ambiente observados.</p>${consumption}</section><div class="page-note"><b>Limite:</b> nenhuma ação desta ficha certifica, publica, executa CI ou comprova implantação real.</div>`);document.getElementById('detail').classList.add('image-dialog')}
function operationalCoverage(){const r=demoRuns[0];return originalHeader('Adoção e cobertura','Distinguir base certificada, publicação e consumo efetivo pela aplicação.')+`<div class="page-note"><b>Exemplo ilustrativo.</b> Esta página usa o mesmo ${r.id} de Imagens e Automações. Não há inventário real de ECR, repositórios consumidores ou EKS.</div><section class="panel">${panelhead('Vínculo demonstrado na interface','Um digest certificado pode estar publicado sem prova de adoção em aplicação.')}<div class="demo-chain"><div><small>Base</small><strong>${r.title}</strong><span>${r.id}</span></div><div><small>Gate existente</small><strong>${r.gateState}</strong><span>${r.gate}</span></div><div><small>ECR</small><strong>Publicado no cenário</strong><span>${demoShort(r.published)}</span></div><div><small>Aplicação</small><strong>Não confirmada</strong><span>FROM + release pendentes</span></div><div><small>Ambiente</small><strong>Não confirmado</strong><span>Digest implantado ausente</span></div></div><div class="demo-actions"><button class="btn" onclick="showImage('ubi9')">Abrir ficha da base</button><button class="btn" onclick="showRun('DEMO-RUN-042')">Abrir run e gate</button></div></section><section class="panel section-gap">${panelhead('Outros estados do cenário','Falha ou fonte indisponível nunca vira adoção presumida.')}<div class="demo-links"><button class="textbtn" onclick="showRun('DEMO-RUN-043')">PySpark: build bloqueado, sem publicação →</button><button class="textbtn" onclick="showRun('DEMO-RUN-044')">Debezium Operator: fonte indisponível, estado desconhecido →</button></div></section>`+footer()}

document.getElementById('brand-icon').innerHTML=icon('box');document.getElementById('mobile-nav').innerHTML=pages.map(p=>`<option value="${p[0]}">${p[1]}</option>`).join('');document.getElementById('mobile-nav').onchange=e=>go(e.target.value);document.getElementById('detail').addEventListener('close',()=>{const dialog=document.getElementById('detail');if(!dialog.open&&modalReturnFocus?.isConnected)modalReturnFocus.focus()});document.getElementById('detail').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close()}});go('overview');

</script>
</body>
</html>
